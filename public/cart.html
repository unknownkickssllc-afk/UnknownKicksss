<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/logo.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="/logo.jpg" />
  <title>Cart — Unknown Kicks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-inner">
  <header class="site-header site-header--dark">
    <nav class="nav-left">
      <a href="index.html">Home</a>
      <a href="index.html#catalog">Catalog</a>
    </nav>
    <a href="index.html" class="brand-logo"><img src="logo.jpg" alt="Unknown Kicks" /></a>
    <div class="nav-right">
      <a href="cart.html" data-cart-count>Cart (0)</a>
    </div>
  </header>

  <main class="page-main">
    <div class="cart-header">
      <h1 class="page-title">Cart</h1>
      <a id="cart-continue" class="cart-continue" href="index.html#catalog" hidden>Continue shopping →</a>
    </div>

    <div id="cart-empty" class="cart-empty" hidden>
      <p>Your cart is empty.</p>
      <a class="btn-ghost" href="index.html#catalog" style="color:var(--fg);border-color:var(--fg)">Continue shopping</a>
    </div>

    <div id="cart-content" class="cart-layout" hidden>
      <div class="cart-items" id="cart-items"></div>

      <aside class="cart-summary">
        <h2 class="cart-summary__title">Order summary</h2>
        <div class="cart-summary__row">
          <span>Subtotal (<span id="cart-item-count">0</span> items)</span>
          <span id="cart-subtotal">$0.00</span>
        </div>
        <div class="cart-summary__divider"></div>
        <div class="cart-summary__row cart-summary__row--total">
          <span>Total</span>
          <strong id="cart-total">$0.00</strong>
        </div>
        <a href="checkout.html" class="btn-cart cart-summary__checkout">Proceed to checkout</a>
        <p class="cart-summary__note">Secure checkout powered by Stripe</p>
      </aside>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
