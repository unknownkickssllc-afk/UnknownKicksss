<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/logo.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="/logo.jpg" />
  <title>Cart — Unknown Kicks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-inner">
  <header class="site-header site-header--dark">
    <nav class="nav-left">
      <a href="index.html">Home</a>
      <a href="index.html#catalog">Catalog</a>
    </nav>
    <a href="index.html" class="brand-logo"><img src="logo.jpg" alt="Unknown Kicks" /></a>
    <div class="nav-right">
      <a href="cart.html" data-cart-count>Cart (0)</a>
    </div>
  </header>

  <main class="page-main">
    <h1 class="page-title">Cart</h1>
    <div id="cart-empty" class="cart-empty" hidden>
      <p>Your cart is empty.</p>
      <a class="btn-ghost" href="index.html#catalog" style="color:var(--fg);border-color:var(--fg)">Continue shopping</a>
    </div>
    <div id="cart-content" hidden>
      <div class="cart-table-wrap">
      <table class="cart-table">
        <thead>
          <tr><th>Product</th><th>Size</th><th>Color</th><th>Qty</th><th>Price</th><th></th></tr>
        </thead>
        <tbody id="cart-rows"></tbody>
      </table>
      </div>
      <div class="cart-footer">
        <p class="cart-total">Subtotal: <strong id="cart-subtotal">$0.00</strong></p>
        <a href="checkout.html" class="btn-cart" style="display:inline-block;text-align:center;max-width:280px">Checkout</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
