<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/logo.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="/logo.jpg" />
  <title>Admin — Unknown Kicks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-layout">
      <aside class="login-brand" aria-hidden="true">
        <div class="login-brand__head">
          <img src="/logo.jpg" alt="Unknown Kicks" class="login-brand__logo" />
          <p class="login-brand__tagline">Admin Dashboard</p>
        </div>
        <p class="login-brand__copy">Manage products, orders, referrals, and site content.</p>
      </aside>

      <section class="login-panel">
        <div class="login-panel__inner">
          <header class="login-header">
            <img src="/logo.jpg" alt="Unknown Kicks" class="login-header__logo" />
            <h1>Sign in</h1>
            <p>Use your admin credentials to access the dashboard.</p>
          </header>

          <form id="login-form" class="login-form" novalidate>
            <div class="field">
              <label for="login-email">Email</label>
              <input
                id="login-email"
                type="email"
                name="email"
                required
                autocomplete="username"
                placeholder="you@company.com"
                spellcheck="false"
              />
            </div>

            <div class="field">
              <label for="login-password">Password</label>
              <div class="password-wrap">
                <input
                  id="login-password"
                  type="password"
                  name="password"
                  required
                  autocomplete="current-password"
                  placeholder="Enter your password"
                />
                <button type="button" id="toggle-password" class="password-toggle" aria-label="Show password">
                  Show
                </button>
              </div>
            </div>

            <p id="login-error" class="login-error" role="alert" hidden></p>

            <button type="submit" id="login-submit" class="login-submit">
              <span class="login-submit__label">Sign in</span>
              <span class="login-submit__spinner" hidden aria-hidden="true"></span>
            </button>
          </form>

          <footer class="login-footer">
            <a href="/">← Back to store</a>
          </footer>
        </div>
      </section>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-top">
        <img src="/logo.jpg" alt="Unknown Kicks" class="sidebar-logo" />
        <span class="sidebar-label">Admin</span>
      </div>
      <nav class="sidebar-nav" aria-label="Admin navigation">
        <button type="button" data-view="overview" class="nav-item is-active">
          <span class="nav-icon" aria-hidden="true">◫</span>
          Dashboard
        </button>
        <button type="button" data-view="products" class="nav-item">
          <span class="nav-icon" aria-hidden="true">▣</span>
          Products
        </button>
        <button type="button" data-view="orders" class="nav-item">
          <span class="nav-icon" aria-hidden="true">☰</span>
          Orders
        </button>
        <button type="button" data-view="barbers" class="nav-item">
          <span class="nav-icon" aria-hidden="true">✂</span>
          Barbers
        </button>
        <button type="button" data-view="content" class="nav-item">
          <span class="nav-icon" aria-hidden="true">⌂</span>
          Homepage
        </button>
      </nav>
      <div class="sidebar-footer">
        <a href="/" class="sidebar-link">View store →</a>
        <button type="button" id="logout-btn" class="logout-btn">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="main-header__text">
          <h1 id="view-title">Dashboard</h1>
          <p id="view-subtitle" class="view-subtitle">Your store at a glance</p>
        </div>
        <span id="admin-email" class="user-badge"></span>
      </header>
      <div id="view-root" class="view-root"></div>
    </main>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root" class="modal-root" hidden></div>

  <script src="/admin/admin.js"></script>
</body>
</html>
